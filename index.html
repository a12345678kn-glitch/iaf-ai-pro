<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القاعدة ضغط - ابراهيم ال فارس</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal';background:#08080a;color:#fff}.gold{background:linear-gradient(90deg,#fde047,#eab308);color:#000}</style>
</head>
<body>
<header class="flex justify-between items-center px-4 py-3 bg-[#121214] border-b border-zinc-800"><div class="flex gap-2 items-center"><div class="w-8 h-8 rounded-lg bg-[#fde047] text-black font-extrabold flex items-center justify-center">CB</div><span class="font-bold text-sm">القاعدة ضغط</span><span class="text-[10px] bg-zinc-800 px-2 py-1 rounded-full">ابراهيم ال فارس</span></div><span>≡</span></header>
<div class="max-w-[700px] mx-auto px-4 py-6">
<h1 class="text-3xl font-extrabold text-center">طريقة التحميل</h1>
<div class="mt-6 bg-[#121214] rounded-[20px] p-5 border border-zinc-800">
<label for="fileInput" class="block bg-[#08080a] border-2 border-dashed border-zinc-700 rounded-2xl p-10 text-center cursor-pointer"><div class="w-12 h-12 mx-auto rounded-xl bg-[#fde047] flex items-center justify-center text-black text-2xl">+</div><p class="font-bold mt-3">حدد الفيديو</p></label>
<input type="file" id="fileInput" accept="video/*" hidden>
<div id="fileInfo" class="hidden mt-4 bg-[#08080a] border border-zinc-800 rounded-xl p-3 text-sm"></div>

<div id="methodBox" class="hidden mt-6">
<p class="font-bold mb-3">2 - اختر طريقة</p>
<label class="flex gap-2 bg-[#1e1c12] border border-amber-400/30 rounded-xl p-3 mb-2"><input type="radio" name="m" value="high" checked><span class="text-sm">أعلى جودة + 60 اطار ⭐</span></label>
<label class="flex gap-2 bg-[#121214] border border-zinc-800 rounded-xl p-3 mb-2"><input type="radio" name="m" value="720"><span class="text-sm">720p60 طريقة</span></label>
<label class="flex gap-2 bg-[#121214] border border-zinc-800 rounded-xl p-3"><input type="checkbox" id="tik" checked><span class="text-sm">تحسين حجم الملف لتيك توك</span></label>
<button id="startBtn" disabled class="w-full mt-5 bg-zinc-700 text-zinc-400 py-4 rounded-xl font-bold">جاري تحميل محرك الضغط... 0%</button>
<div class="w-full bg-zinc-800 h-2 rounded-full mt-3 overflow-hidden"><div id="bar" class="h-full gold" style="width:0%"></div></div>
<p id="perc" class="text-center text-xs text-amber-300 mt-2">0%</p>
</div>

<div id="final" class="hidden mt-6 text-center">
<div class="w-16 h-16 mx-auto rounded-full bg-[#fde047] flex items-center justify-center text-black text-2xl">✓</div>
<h2 class="text-xl font-bold mt-3">الفيديو الخاص بك جاهز</h2>
<video id="prev" controls class="w-full mt-4 rounded-xl bg-black"></video>
<a id="dl" download="ibrahim-alfaris.mp4" class="w-full gold py-4 rounded-xl font-bold block mt-4 text-center">تنزيل الفيديو ⬇️</a>
</div>
</div>
</div>

<script type="module">
import {FFmpeg} from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm";
import {fetchFile, toBlobURL} from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm";
let ffmpeg=null, file=null, isLoaded=false;
const startBtn=document.getElementById('startBtn'), bar=document.getElementById('bar'), perc=document.getElementById('perc');

document.getElementById('fileInput').onchange=async e=>{
  file=e.target.files[0]; if(!file)return;
  document.getElementById('fileInfo').classList.remove('hidden');
  document.getElementById('fileInfo').textContent=file.name+' - '+(file.size/1024/1024).toFixed(2)+' MB';
  document.getElementById('methodBox').classList.remove('hidden');
  // نبدأ تحميل المحرك مباشرة من تختار الفيديو
  if(!ffmpeg){
    ffmpeg=new FFmpeg();
    ffmpeg.on('progress',({progress})=>{
      const p=Math.round(progress*100);
      if(isLoaded){ bar.style.width=p+'%'; perc.textContent=`جاري الضغط ${p}%`; }
    });
    try{
      const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';
      // هذا السطر المهم - يحمل المحرك كـ Blob حتى يشتغل على workers.dev
      await ffmpeg.load({
        coreURL: await toBlobURL(`${base}/ffmpeg-core.js`,'text/javascript'),
        wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`,'application/wasm'),
      });
      isLoaded=true;
      startBtn.disabled=false;
      startBtn.className='w-full mt-5 gold py-4 rounded-xl font-bold';
      startBtn.textContent='بدء المعالجة →';
      perc.textContent='المحرك جاهز 100%';
      bar.style.width='100%';
    }catch(err){
      alert('فشل تحميل المحرك، تأكد النت قوي وحدث الصفحة: '+err.message);
    }
  }
};

startBtn.onclick=async()=>{
  if(!isLoaded){ alert('انتظر المحرك يكمل تحميل'); return; }
  if(!file)return;
  startBtn.disabled=true; startBtn.textContent='جاري الضغط... لا تطلع من الصفحة';
  bar.style.width='0%';
  const method=document.querySelector('input[name="m"]:checked').value;
  await ffmpeg.writeFile('in.mp4', await fetchFile(file));
  let cmd=['-i','in.mp4'];
  if(method==='high') cmd.push('-vf','scale=-2:1080','-r','60','-c:v','libx264','-crf','20','-preset','veryfast');
  else cmd.push('-vf','scale=720:-2','-r','60','-c:v','libx264','-crf','23','-preset','veryfast');
  cmd.push('-c:a','aac','-b:a','128k','-movflags','+faststart','out.mp4');
  await ffmpeg.exec(cmd);
  const data=await ffmpeg.readFile('out.mp4');
  const url=URL.createObjectURL(new Blob([data.buffer],{type:'video/mp4'}));
  document.getElementById('final').classList.remove('hidden');
  document.getElementById('prev').src=url;
  document.getElementById('dl').href=url;
  startBtn.disabled=false; startBtn.textContent='تم! اضغط مرة ثانية اذا تريد';
};
</script>
</body>
</html>
