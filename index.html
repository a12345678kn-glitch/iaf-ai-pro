<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompressBase | المعالج الذكي</title>
    <style>
        :root {
            --bg: #0b1020;
            --panel: #151c32;
            --gold: #f5c928;
            --gold-light: #ffe477;
            --text: #f5f1df;
            --muted: #aab4dc;
            --border: #293451;
            --primary: #7657ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Tahoma', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--panel);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            color: var(--gold);
            font-size: 28px;
            margin-bottom: 10px;
        }

        p.description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: right;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--gold-light);
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="file"], select {
            width: 100%;
            padding: 12px;
            background: #0f1629;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--gold);
        }

        .btn-process {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, var(--primary), #a28eff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(118, 87, 255, 0.3);
        }

        .btn-process:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 87, 255, 0.5);
        }

        .btn-process:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            color: var(--muted);
        }

        .download-link {
            display: none;
            background: #00c853;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CompressBase</h1>
    <p class="description">
        تطبيق الضغط العكسي الذكي. نعيد هندسة الفيديو ليتوافق مع معايير تيك توك وإنستجرام لضمان أعلى دقة ممكنة.
    </p>

    <form id="processForm">
        <div class="form-group">
            <label>اختر الفيديو من جهازك</label>
            <input type="file" id="videoFile" accept="video/*" required>
        </div>

        <div class="form-group">
            <label>دقة التصدير المستهدفة</label>
            <select id="preset">
                <option value="1080">1080p (جودة خارقة)</option>
                <option value="720">720p (جودة عالية)</option>
            </select>
        </div>

        <div class="form-group">
            <label>سلاسة الحركة (FPS)</label>
            <select id="fps">
                <option value="60">60 FPS (سلاسة تامة)</option>
                <option value="30">30 FPS (قياسي)</option>
            </select>
        </div>

        <button type="submit" id="submitBtn" class="btn-process">بدء المعالجة الآن</button>
    </form>

    <div id="status"></div>
    <a id="downloadBtn" class="download-link" href="#">تحميل الفيديو المعالج</a>
</div>

<script>
    const form = document.getElementById('processForm');
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');

    form.onsubmit = async (e) => {
        e.preventDefault();
        
        // محاكاة لعملية الرفع والمعالجة (لأن المعالجة تحتاج سيرفر FFmpeg)
        btn.disabled = true;
        btn.innerText = "جاري رفع الفيديو...";
        status.innerText = "يتم الآن تحليل الـ Bitrate وضبط الترميز...";
        downloadBtn.style.display = "none";

        // هنا يتم إرسال الملف للسيرفر (مثال)
        const formData = new FormData();
        formData.append('video', document.getElementById('videoFile').files[0]);
        formData.append('preset', document.getElementById('preset').value);
        formData.append('fps', document.getElementById('fps').value);

        try {
            // ملاحظة: هذا الرابط يجب أن يكون رابط السيرفر الخاص بك
            const response = await fetch('/process', { 
                method: 'POST', 
                body: formData 
            });
            const data = await response.json();

            if(data.url) {
                status.innerText = "تمت المعالجة بنجاح! الفيديو الآن جاهز للنشر.";
                downloadBtn.href = data.url;
                downloadBtn.style.display = "block";
            } else {
                throw new Error();
            }
        } catch (err) {
            // بما أنك تجرب الكود على هاتفك بدون سيرفر حالياً، ستظهر هذه الرسالة:
            status.innerHTML = "<span style='color: #ff4d4d;'>تنبيه: الواجهة تعمل، ولكنك تحتاج لربطها بسيرفر FFmpeg لتتم المعالجة فعلياً.</span>";
        } finally {
            btn.disabled = false;
            btn.innerText = "بدء المعالجة الآن";
        }
    };
</script>

</body>
</html>
