<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تيك توك | إبراهيم آل فارس</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* حاوية التطبيق الرئيسية بحجم الهاتف */
        .tiktok-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #121212;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        @media (min-width: 430px) {
            .tiktok-container {
                height: 850px;
                border-radius: 25px;
                border: 2px solid #222;
            }
        }

        /* الهيدر العلوي */
        .top-nav {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 10;
            font-size: 1rem;
            font-weight: 700;
        }

        .top-nav span {
            color: #888;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .top-nav span.active {
            color: #fff;
            border-bottom: 2px solid #ffb703;
            padding-bottom: 3px;
        }

        /* منطقة عرض الفيديو */
        .video-feed {
            flex: 1;
            position: relative;
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-bg-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffb703;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            background: radial-gradient(circle, #252836 0%, #090a0f 100%);
        }

        /* تفاصيل الفيديو ووصفه في الأسفل */
        .video-info {
            position: absolute;
            bottom: 70px;
            right: 15px;
            left: 70px;
            z-index: 5;
            text-align: right;
        }

        .username {
            font-weight: 900;
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .caption {
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 8px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .hashtags {
            color: #ffb703;
            font-weight: bold;
            font-size: 0.85rem;
        }

        /* الأزرار الجانبية (إعجاب، تعليقات، مشاركة) */
        .sidebar-actions {
            position: absolute;
            bottom: 80px;
            left: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 5;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .action-btn {
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            margin-bottom: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 183, 3, 0.2);
            border-color: #ffb703;
        }

        .action-count {
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            height: 60px;
            background: #000;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #777;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-item span.icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        /* زر الإضافة (+) المميز في المنتصف */
        .add-video-btn {
            width: 42px;
            height: 28px;
            background: linear-gradient(90deg, #ffb703, #ff0050);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-weight: 900;
            font-size: 1.2rem;
            box-shadow: 0 0 10px rgba(255,183,3,0.5);
        }
    </style>
</head>
<body>

    <div class="tiktok-container">
        <!-- شريط التنقل العلوي -->
        <div class="top-nav">
            <span>متابعة</span>
            <span class="active">لك</span>
        </div>

        <!-- عرض الفيديو الرئيسي -->
        <div class="video-feed">
            <div class="video-bg-placeholder">
                <div style="font-size: 40px; margin-bottom: 10px;">✨📱</div>
                <div>عروض وتصاميم 4K 120fps</div>
                <div style="font-size: 0.8rem; color: #aaa; margin-top: 5px;">إبراهيم آل فارس</div>
            </div>

            <!-- معلومات الفيديو -->
            <div class="video-info">
                <div class="username">@Ibrahim_AlFares</div>
                <div class="caption">شرح الطريقة الخرافية لرفع جودة الفيديوهات وتثبيت الإطارات بدقة مذهلة 😍🔥</div>
                <div class="hashtags">#4k #120fps #explore #ابراهيم_ال_فارس #اكسبلور</div>
            </div>

            <!-- الأزرار الجانبية التفاعلية -->
            <div class="sidebar-actions">
                <div class="action-item" onclick="toggleLike(this)">
                    <div class="action-btn" id="likeIcon">❤️</div>
                    <span class="action-count" id="likeCount">14.2K</span>
                </div>
                <div class="action-item">
                    <div class="action-btn">💬</div>
                    <span class="action-count">842</span>
                </div>
                <div class="action-item">
                    <div class="action-btn">⭐</div>
                    <span class="action-count">3.1K</span>
                </div>
                <div class="action-item">
                    <div class="action-btn">↗️</div>
                    <span class="action-count">1.5K</span>
                </div>
            </div>
        </div>

        <!-- شريط التنقل السفلي لتطبيق تيك توك -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <span class="icon">🏠</span>
                <span>الرئيسية</span>
            </div>
            <div class="nav-item">
                <span class="icon">👥</span>
                <span>الأصدقاء</span>
            </div>
            <div class="item">
                <div class="add-video-btn">+</div>
            </div>
            <div class="nav-item">
                <span class="icon">📥</span>
                <span>الوارد</span>
            </div>
            <div class="nav-item">
                <span class="icon">👤</span>
                <span>الملف الشخصي</span>
            </div>
        </div>
    </div>

    <script>
        // تفاعل زر الإعجاب عند الضغط عليه
        let liked = false;
        function toggleLike(element) {
            liked = !liked;
            const countElem = document.getElementById('likeCount');
            const iconElem = document.getElementById('likeIcon');
            if(liked) {
                iconElem.style.transform = 'scale(1.3)';
                countElem.innerText = '14.3K';
                element.style.color = '#ff0050';
            } else {
                iconElem.style.transform = 'scale(1)';
                countElem.innerText = '14.2K';
                element.style.color = '#fff';
            }
        }
    </script>
</body>
</html>
