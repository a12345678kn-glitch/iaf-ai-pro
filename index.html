<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ضاغط تيك توك - TikTok Compressor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');
body{font-family:'Tajawal',sans-serif}
</style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center p-4">

  <div class="w-full max-w-2xl mt-6">
    <h1 class="text-3xl font-extrabold text-center">TikTok Compressor 🔥</h1>
    <p class="text-center text-zinc-400 mt-2">اضغط الفيديو قبل النشر بدون ما تخرب الجودة - 100% على جهازك</p>

    <!-- Upload Box -->
    <div id="dropZone" class="mt-8 border-2 border-dashed border-zinc-700 rounded-2xl p-10 text-center cursor-pointer hover:border-white transition bg-zinc-900/50">
      <div class="text-5xl mb-3">📁</div>
      <p class="font-bold">اسحب الفيديو هنا أو اضغط للاختيار</p>
      <p class="text-sm text-zinc-500 mt-1">MP4, MOV, WEBM - حتى 500MB</p>
      <input type="file" id="fileInput" accept="video/*" hidden>
    </div>

    <!-- Settings -->
    <div id="settings" class="hidden mt-6 bg-zinc-900 rounded-2xl p-5">
      <div class="flex justify-between items-center">
        <video id="preview" class="w-28 h-48 object-cover rounded-xl bg-black" muted></video>
        <div class="flex-1 mr-5 space-y-4">
          <div class="flex justify-between text-sm">
            <span class="text-zinc-400">الحجم الأصلي</span>
            <span id="origSize" class="font-bold">--</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-zinc-400">الحجم بعد الضغط</span>
            <span id="newSize" class="font-bold text-green-400">--</span>
          </div>
          <label class="block text-sm">
            <span class="text-zinc-400">قوة الضغط (لتيك توك اختار متوسط)</span>
            <select id="quality" class="w-full mt-2 bg-black border border-zinc-700 rounded-xl p-3">
              <option value="high">جودة عالية - للتصوير 4K</option>
              <option value="medium" selected>متوازن - أفضل لتيك توك ⭐</option>
              <option value="strong">ضغط قوي - للنت الضعيف</option>
            </select>
          </label>
        </div>
      </div>

      <button id="compressBtn" class="w-full mt-5 bg-white text-black font-extrabold py-4 rounded-xl hover:bg-zinc-200 transition">
        ابدأ الضغط الآن
      </button>

      <div id="progressWrap" class="hidden mt-4">
        <div class="w-full bg-zinc-800 rounded-full h-3 overflow-hidden">
          <div id="progressBar" class="h-full bg-white transition-all" style="width:0%"></div>
        </div>
        <p id="progressText" class="text-center text-sm text-zinc-400 mt-2">جاري التحميل...</p>
      </div>

      <a id="downloadBtn" class="hidden w-full mt-4 bg-[#fe2c55] text-white font-bold py-4 rounded-xl text-center block" download="tiktok-ready.mp4">
        تحميل الفيديو جاهز لتيك توك ⬇️
      </a>
    </div>
  </div>

<script>
const { FFmpeg } = FFmpegWASM;
const { fetchFile } = FFmpegUtil;
let ffmpeg, inputFile;

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const settings = document.getElementById('settings');
const origSizeEl = document.getElementById('origSize');
const newSizeEl = document.getElementById('newSize');
const compressBtn = document.getElementById('compressBtn');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
const downloadBtn = document.getElementById('downloadBtn');
const qualitySelect = document.getElementById('quality');

dropZone.onclick = () => fileInput.click();
dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('border-white'); }
dropZone.ondragleave = () => dropZone.classList.remove('border-white');
dropZone.ondrop = e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); }
fileInput.onchange = e => handleFile(e.target.files[0]);

function handleFile(file){
  if(!file) return;
  inputFile = file;
  preview.src = URL.createObjectURL(file);
  origSizeEl.textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
  settings.classList.remove('hidden');
  window.scrollTo({top: 400, behavior: 'smooth'});
}

compressBtn.onclick = async () => {
