<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الذكاء الاصطناعي - Gemini AI Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #080a0f; color: #f3f4f6; font-family: Tahoma, sans-serif; }
        .custom-gradient { background: linear-gradient(135deg, #2563eb, #dc2626); }
        .custom-border { border: 1px solid rgba(37, 99, 235, 0.3); }
        .chat-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- الهيدر -->
    <header class="p-4 border-b border-gray-800 flex justify-between items-center max-w-5xl mx-auto w-full">
        <div class="flex items-center gap-3">
            <span class="custom-gradient text-white font-extrabold px-3.5 py-1.5 rounded-xl text-sm shadow-lg">✨ GEMINI PRO</span>
            <div>
                <h1 class="font-bold text-sm">موقع الذكاء الاصطناعي الخاص بك</h1>
                <p class="text-[10px] text-gray-400">ربط مباشر مع محرك Google Gemini</p>
            </div>
        </div>
        <div>
            <button onclick="toggleApiKeyModal()" class="text-xs bg-gray-900 custom-border px-3.5 py-2 rounded-xl text-blue-400 hover:text-white transition font-bold shadow-md cursor-pointer">
                🔑 إعداد التوكن (API Key)
            </button>
        </div>
    </header>

    <!-- منطقة المحادثة -->
    <main class="max-w-3xl mx-auto w-full p-4 my-2 flex-1 flex flex-col justify-between">
        
        <div class="chat-card custom-border rounded-3xl p-5 shadow-2xl mb-4 flex-1 flex flex-col h-[70vh]">
            <div id="chatMessages" class="flex-1 overflow-y-auto space-y-4 pr-2 pl-2 text-sm leading-relaxed">
                
                <div class="flex items-start gap-3">
                    <div class="custom-gradient w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0">AI</div>
                    <div class="bg-gray-900 custom-border p-3.5 rounded-2xl max-w-[85%] text-gray-200 text-xs">
                        أهلاً بك! اضغط على زر <strong>"إعداد التوكن"</strong> بالأعلى، الصق التوكن الخاص بك مرة واحدة فقط ليتم حفظه في متصفحك وتتمكن من الدردشة فوراً.
                    </div>
                </div>

            </div>
        </div>

        <!-- صندوق الإدخال -->
        <div class="chat-card custom-border rounded-2xl p-2.5 shadow-xl flex items-center gap-2">
            <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." class="w-full bg-transparent text-xs text-gray-200 px-3 py-2 focus:outline-none" onkeydown="if(event.key === 'Enter') handleSend()">
            <button onclick="handleSend()" class="custom-gradient px-5 py-2.5 rounded-xl text-xs font-bold tracking-wide shadow-lg hover:opacity-90 transition cursor-pointer shrink-0">
                إرسال 🚀
            </button>
        </div>

    </main>

    <!-- نافذة التوكن -->
    <div id="apiModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 custom-border rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
            <h3 class="text-sm font-bold text-blue-400 mb-2">إدخال مفتاح Gemini API Key</h3>
            <p class="text-xs text-gray-400 mb-4">الصق التوكن الخاص بك هنا (سيتم حفظه في جهازك فقط بأمان):</p>
            
            <input type="password" id="apiKeyInput" placeholder="AQ..." class="w-full bg-gray-950 custom-border p-3 rounded-xl text-xs text-gray-200 mb-4 focus:outline-none text-left" dir="ltr">
            
            <div class="flex gap-2">
                <button onclick="saveApiKey()" class="w-full py-2.5 rounded-xl custom-gradient text-xs font-bold cursor-pointer">حفظ</button>
                <button onclick="toggleApiKeyModal()" class="w-full py-2.5 rounded-xl bg-gray-800 text-xs text-gray-400 cursor-pointer">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key') || '';

        function toggleApiKeyModal() {
            const modal = document.getElementById('apiModal');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden') && apiKey) {
                document.getElementById('apiKeyInput').value = apiKey;
            }
        }

        function saveApiKey() {
            const val = document.getElementById('apiKeyInput').value.trim();
            if (val) {
                apiKey = val;
                localStorage.setItem('gemini_api_key', apiKey);
                alert('تم حفظ التوكن في متصفحك بنجاح!');
                toggleApiKeyModal();
            } else {
                alert('الرجاء إدخال توكن صحيح.');
            }
        }

        async function handleSend() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            if (!apiKey) {
                alert('الرجاء إدخال التوكن (API Key) أولاً عبر الزر العلوي.');
                toggleApiKeyModal();
                return;
            }

            appendMessage('أنت', message, 'user');
            input.value = '';

            const loadingId = appendMessage('AI', 'جاري التفكير والمعالجة عبر Gemini...', 'ai-loading');

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: message }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage('AI', reply, 'ai');
                } else {
                    appendMessage('AI', 'حدث خطأ في الاستجابة. تأكد من صحة التوكن المرفق.', 'ai');
                }

            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage('AI', 'تعذر الاتصال بسيرفرات Gemini. تحقق من الاتصال.', 'ai');
            }
        }

        function appendMessage(sender, text, type) {
            const container = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            const id = 'msg_' + Date.now();
            msgDiv.id = id;

            if (type === 'user') {
                msgDiv.className = "flex items-start gap-3 justify-end";
                msgDiv.innerHTML = `
                    <div class="bg-blue-600/20 custom-border p-3.5 rounded-2xl max-w-[85%] text-gray-100 text-right text-xs">
                        ${escapeHtml(text)}
                    </div>
                    <div class="bg-gray-800 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0 text-blue-400">أنت</div>
                `;
            } else {
                msgDiv.className = "flex items-start gap-3";
                msgDiv.innerHTML = `
                    <div class="custom-gradient w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0">AI</div>
                    <div class="bg-gray-900 custom-border p-3.5 rounded-2xl max-w-[85%] text-gray-200 text-xs">
                        ${escapeHtml(text).replace(/\n/g, '<br>')}
                    </div>
                `;
            }

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
