<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إبراهيم ال فارس | تحسين الفيديو PRO</title>
    <style>
        :root {
            --bg: #080b14;
            --panel: #111827;
            --gold: #f5c928;
            --gold-light: #ffe477;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
            --primary: #7657ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Tahoma', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--panel);
            width: 100%;
            max-width: 550px;
            border-radius: 30px;
            border: 1px solid var(--border);
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        /* تأثير الضوء في الخلفية */
        .container::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(118, 87, 255, 0.1) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .content { position: relative; z-index: 1; }

        h1 {
            color: var(--gold);
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 900;
        }

        p {
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .upload-area {
            border: 2px dashed var(--primary);
            padding: 40px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(118, 87, 255, 0.05);
            margin-bottom: 25px;
        }

        .upload-area:hover {
            background: rgba(118, 87, 255, 0.1);
            border-color: var(--gold);
        }

        .upload-area span {
            display: block;
            color: var(--text);
            font-weight: bold;
            margin-bottom: 10px;
        }

        #videoFile { display: none; }

        .btn-optimize {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, var(--primary), #a28eff);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 20px rgba(118, 87, 255, 0.3);
        }

        .btn-optimize:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(118, 87, 255, 0.5);
        }

        .btn-optimize:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            color: var(--gold-light);
            min-height: 20px;
        }

        .download-btn {
            display: none;
            background: #00c853;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="content">
        <h1>إبراهيم ال فارس PRO</h1>
        <p>نظام تحسين الجودة الخارق لرفع الفيديوهات بدون تغبيش على تيك توك وإنستجرام</p>

        <form id="uploadForm">
            <label class="upload-area" id="dropzone">
                <span id="fileLabel">اضغط هنا لرفع الفيديو 📁</span>
                <input type="file" id="videoFile" accept="video/*" required>
            </label>

            <button type="submit" id="submitBtn" class="btn-optimize">بدء المعالجة الذكية ✨</button>
        </form>

        <div id="status"></div>
        <a id="downloadBtn" class="download-btn" href="#" download>تحميل الفيديو المحسن 📥</a>
    </div>
</div>

<script>
    const fileInput = document.getElementById('videoFile');
    const fileLabel = document.getElementById('fileLabel');
    const form = document.getElementById('uploadForm');
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');

    // تحديث اسم الملف عند الاختيار
    fileInput.onchange = () => {
        if(fileInput.files.length > 0) {
            fileLabel.innerText = "تم اختيار: " + fileInput.files[0].name;
            fileLabel.style.color = "#f5c928";
        }
    };

    form.onsubmit = async (e) => {
        e.preventDefault();
        
        const formData = new FormData();
        formData.append('video', fileInput.files[0]);

        btn.disabled = true;
        btn.innerText = "جاري المعالجة... يرجى الانتظار";
        status.innerText = "يتم الآن تطبيق خوارزمية (CRF 18) لتحسين حدة البكسلات...";
        downloadBtn.style.display = "none";

        try {
            // هنا يتم الربط مع السيرفر (الذي يعالج الفيديو فعلياً)
            const response = await fetch('/optimize', { 
                method: 'POST', 
                body: formData 
            });
            const data = await response.json();

            if(data.url) {
                status.innerText = "تم التحسين بنجاح! الفيديو الآن جاهز للنشر بدقة خارقة.";
                downloadBtn.href = data.url;
                downloadBtn.style.display = "block";
            } else {
                status.innerText = "خطأ في المعالجة.";
            }
        } catch (err) {
            // رسالة تظهر إذا لم يكن هناك سيرفر مربوط حالياً
            status.innerHTML = "<span style='color:#ff4d4d;'>تنبيه: الواجهة تعمل بنجاح، ولكن تحتاج لربطها بسيرفر FFmpeg لتتم المعالجة.</span>";
        } finally {
            btn.disabled = false;
            btn.innerText = "بدء المعالجة الذكية ✨";
        }
    };
</script>

</body>
</html>
