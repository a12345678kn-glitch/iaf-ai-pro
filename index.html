<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IAF VideoFix - إصلاح الفيديو بالذكاء الاصطناعي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Tahoma,sans-serif;background:#07090d;color:#fff;min-height:100vh}
.container{max-width:900px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 0}
.logo{font-size:24px;font-weight:900}
.logo span{color:#19e6b2}
.badge{background:#101820;border:1px solid #1d3c38;padding:6px 12px;border-radius:20px;color:#72f5d3;font-size:11px}
.hero{text-align:center;padding:30px 0}
.hero h1{font-size:32px;margin:10px 0}
.hero h1 span{color:#19e6b2}
.hero p{color:#9aa4b2;line-height:1.7}
.card{background:#0c1117;border:1px solid #18232d;border-radius:20px;padding:20px;margin-top:18px}
.card h3{margin-bottom:15px;font-size:18px}
.upload{border:2px dashed #24433e;background:#0a0f14;border-radius:20px;padding:40px 20px;text-align:center;cursor:pointer;display:block;transition:.2s}
.upload:hover{border-color:#19e6b2}
.up-icon{font-size:48px;margin-bottom:12px}
.upload h2{margin:8px 0;font-size:20px}
.upload p{color:#7f8a97;font-size:13px}
input[type=file]{display:none}
.hidden{display:none}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}
.info-item{background:#101820;padding:12px;border-radius:12px;text-align:center}
.info-item b{display:block;font-size:16px;color:#19e6b2}
.info-item span{color:#7f8a97;font-size:11px}
.doctor-list{margin-top:15px}
.doctor-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#101820;border-radius:10px;margin-bottom:8px;font-size:14px}
.doctor-item .status-ok{color:#19e6b2}
.doctor-item .status-bad{color:#ffb347}
.doctor-item .status-warn{color:#ff6b6b}
.suggestions{margin-top:15px}
.suggestion{padding:12px;background:#0f1a18;border:1px solid #1d3c38;border-radius:10px;margin-bottom:8px;color:#72f5d3;font-size:14px}
button{width:100%;padding:16px;border-radius:14px;border:0;background:#19e6b2;color:#03100c;font-weight:900;font-size:16px;cursor:pointer;margin-top:15px}
button:disabled{opacity:.5;cursor:not-allowed}
button:hover:not(:disabled){filter:brightness(1.08)}
.progress{height:8px;background:#18212a;border-radius:8px;overflow:hidden;margin-top:15px}
.bar{height:100%;width:0%;background:#19e6b2;transition:width .3s}
.status{text-align:center;color:#8f9ba8;margin-top:12px;padding:10px;border-radius:10px;font-size:13px}
.status.success{background:#0d2a1c;color:#19e6b2}
.status.error{background:#2a0d0d;color:#ff6b6b}
.download-link{display:block;margin-top:15px;padding:15px;background:#19e6b2;color:#03100c;text-align:center;border-radius:13px;font-weight:900;text-decoration:none}
footer{text-align:center;color:#53606d;padding:30px 0;font-size:12px}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">IAF <span>VideoFix</span></div>
<div class="badge">AI VIDEO DOCTOR</div>
</header>
<section class="hero">
<h1>خلّي فيديوك <span>يبدو احترافياً</span></h1>
<p>ارفع الفيديو — وخلي IAF VideoFix يكتشف المشاكل ويصلحها تلقائياً</p>
</section>
<div class="card" id="uploadCard">
<h3>📤 ارفع الفيديو</h3>
<label class="upload" for="videoInput">
<div class="up-icon">🎬</div>
<h2>اضغط لاختيار فيديو</h2>
<p>MP4 • MOV • WebM</p>
</label>
<input id="videoInput" type="file" accept="video/*">
</div>
<div class="card hidden" id="doctorCard">
<h3>🔍 تحليل الفيديو</h3>
<div class="info-grid">
<div class="info-item"><b id="resolution">—</b><span>الدقة</span></div>
<div class="info-item"><b id="fps">—</b><span>FPS</span></div>
<div class="info-item"><b id="size">—</b><span>الحجم</span></div>
</div>
<div class="doctor-list" id="diagnosis"></div>
</div>
<div class="card hidden" id="suggestCard">
<h3>✨ اقتراح IAF</h3>
<div class="suggestions" id="suggestions"></div>
<button id="fixBtn">🚀 إصلاح الفيديو بالكامل</button>
<div class="progress"><div class="bar" id="progressBar"></div></div>
<div class="status" id="statusText">جاهز للبدء</div>
</div>
<footer>IAF VideoFix © 2026</footer>
</div>
<script>
const BACKEND_URL="https://iaf-ai-backend.a12345678kn.workers.dev";
const input=document.getElementById("videoInput");
const doctorCard=document.getElementById("doctorCard");
const suggestCard=document.getElementById("suggestCard");
const fixBtn=document.getElementById("fixBtn");
const progressBar=document.getElementById("progressBar");
const statusText=document.getElementById("statusText");
let selectedFile=null;

input.addEventListener("change",async function(){
const file=this.files[0];
if(!file)return;
selectedFile=file;
document.getElementById("size").textContent=formatSize(file.size);
const video=document.createElement("video");
video.preload="metadata";
video.onloadedmetadata=function(){
document.getElementById("resolution").textContent=video.videoWidth+"×"+video.videoHeight;
const fps=estimateFPS(video);
document.getElementById("fps").textContent=fps;
analyzeVideo(video);
};
video.src=URL.createObjectURL(file);
doctorCard.classList.remove("hidden");
});

function estimateFPS(video){
const dur=video.duration||1;
const w=video.videoWidth,h=video.videoHeight;
if(w>=1920&&h>=1080)return"60";
if(w>=1280)return"30";
return"30";
}

function analyzeVideo(video){
const w=video.videoWidth,h=video.videoHeight;
const items=[];
if(h<1080)items.push({t:"الدقة منخفضة",s:"bad"});
else items.push({t:"الدقة جيدة",s:"ok"});
if(w/h>0.9&&w/h<1.2)items.push({t:"أبعاد مربعة",s:"ok"});
else items.push({t:"أبعاد غير قياسية",s:"warn"});
items.push({t:"تحليل السطوع",s:"warn"});
items.push({t:"كشف الاهتزاز",s:"ok"});
items.push({t:"تحليل الضوضاء",s:"warn"});
const container=document.getElementById("diagnosis");
container.innerHTML="";
items.forEach(item=>{
const div=document.createElement("div");
div.className="doctor-item";
const cls=item.s==="ok"?"status-ok":item.s==="bad"?"status-bad":"status-warn";
const icon=item.s==="ok"?"✅":item.s==="bad"?"⚠️":"🔶";
div.innerHTML=`<span>${icon} ${item.t}</span><span class="${cls}">${item.s==="ok"?"جيد":item.s==="bad"?"ضعيف":"متوسط"}</span>`;
container.appendChild(div);
});
const sugg=[];
if(h<1080)sugg.push("🔥 رفع الدقة إلى 1080p");
sugg.push("✨ تنظيف الفيديو من التشويش");
sugg.push("🎨 تحسين الألوان والإضاءة");
sugg.push("📱 تجهيز TikTok / Instagram");
const suggBox=document.getElementById("suggestions");
suggBox.innerHTML="";
sugg.forEach(s=>{
const div=document.createElement("div");
div.className="suggestion";
div.textContent=s;
suggBox.appendChild(div);
});
suggestCard.classList.remove("hidden");
}

fixBtn.addEventListener("click",async()=>{
if(!selectedFile)return;
fixBtn.disabled=true;
fixBtn.textContent="⏳ جارٍ الرفع...";
statusText.textContent="رفع الفيديو إلى السيرفر...";
progressBar.style.width="5%";
const oldLink=document.querySelector(".download-link");
if(oldLink)oldLink.remove();
try{
const formData=new FormData();
formData.append("video",selectedFile);
formData.append("mode","auto");
const response=await fetch(BACKEND_URL+"/enhance",{method:"POST",body:formData});
if(!response.ok){
const errText=await response.text();
throw new Error("خطأ في السيرفر: "+errText);
}
let prediction=await response.json();
if(prediction.error)throw new Error(prediction.error);
progressBar.style.width="35%";
statusText.textContent="المعالجة جارية...";
fixBtn.textContent="⏳ معالجة...";
let attempts=0;
const maxAttempts=360;
while(prediction.status!=="succeeded"&&prediction.status!=="failed"&&prediction.status!=="canceled"&&attempts<maxAttempts){
await new Promise(r=>setTimeout(r,5000));
attempts++;
const pollRes=await fetch(BACKEND_URL+"/status/"+prediction.id);
prediction=await pollRes.json();
const progress=Math.min(35+attempts*0.3,95);
progressBar.style.width=progress+"%";
statusText.textContent="الحالة: "+translateStatus(prediction.status)+" ("+(attempts*5)+" ثانية)";
}
if(prediction.status==="succeeded"){
progressBar.style.width="100%";
statusText.textContent="✅ تم إصلاح الفيديو بنجاح!";
statusText.className="status success";
const outputUrl=Array.isArray(prediction.output)?prediction.output[0]:prediction.output;
const link=document.createElement("a");
link.href=outputUrl;
link.textContent="🎬 تحميل الفيديو المُحسّن";
link.target="_blank";
link.className="download-link";
fixBtn.parentElement.appendChild(link);
}else if(prediction.status==="failed"){
throw new Error("فشلت المعالجة: "+(prediction.error||"خطأ غير معروف"));
}else{
throw new Error("انتهى الوقت — حاول مجدداً");
}
}catch(err){
console.error(err);
statusText.textContent="❌ "+err.message;
statusText.className="status error";
progressBar.style.width="0%";
}finally{
fixBtn.disabled=false;
fixBtn.textContent="🚀 إصلاح الفيديو بالكامل";
}
});

function translateStatus(s){
const map={starting:"بدء",processing:"معالجة",succeeded:"نجح",failed:"فشل",canceled:"ألغي"};
return map[s]||s;
}

function formatSize(bytes){
if(bytes<1024*1024)return(bytes/1024).toFixed(1)+" KB";
return(bytes/(1024*1024)).toFixed(1)+" MB";
}
</script>
</body>
</html>
